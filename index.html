<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Percorsi Agility</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agility">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#1d2420;--muted:#6b756f;--line:#dfe4dd;--pri:#1f7a4d;--pri2:#e9f5ee;--dan:#c8372d;--acc:#ff7a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:40px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.danger{color:var(--dan);border-color:#f0c9c5}
button.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:40px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.hint{background:var(--pri2);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.banner{background:#fff6e0;border:1px solid #f1dca5;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
/* lista */
.list{max-width:900px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.list h1{font-size:24px;margin:6px 0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.cc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cc .th{background:#e8efe4;height:180px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cc .th svg{width:100%;height:100%}
.cc .bd{padding:10px 12px;flex:1}
.cc .nm{font-weight:650}
.cc .ft{display:flex;gap:6px;padding:0 10px 10px}
.cc .ft button{flex:1;padding:6px;min-height:36px;font-size:14px}
.pawwrap{display:flex;justify-content:center;margin:14px 0 4px}
.paw{border:0;background:none;padding:0;min-height:0;width:230px;max-width:70vw;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(10,60,35,.28));transition:filter .1s}
.paw:active{transform:none;filter:drop-shadow(0 3px 4px rgba(10,60,35,.3))}
.paw svg{width:100%;height:auto;display:block;overflow:visible}
.paw .top{transition:transform .09s ease-out}
.paw:active .top{transform:translateY(7px)}
.pawt{fill:#fff;font:800 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:2px;letter-spacing:.2px}
.home{max-width:640px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.hero .tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.hero .sun{animation:none}.hero .sun>rect{transform-box:view-box}
.hero .cl{animation:drift 40s linear infinite alternate}@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.hero .rd{animation:fall .8s linear infinite}@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-24px,250px)}}
.hero .sf{animation:snow 6s linear infinite}@keyframes snow{0%{transform:translate(0,0)}50%{transform:translate(8px,120px)}100%{transform:translate(-4px,245px)}}
.hero .fg{animation:fog 22s ease-in-out infinite alternate}@keyframes fog{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.hero .flash{opacity:0;animation:flash 6s infinite}.hero .bolt{opacity:0;animation:flash 6s infinite}@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:.85}92%{opacity:0}94%{opacity:.7}96%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hero *{animation:none!important}}
.hero{cursor:pointer;border-radius:20px;overflow:hidden;margin:6px 0 10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.hero svg{display:block;width:100%;height:auto}
.hello{display:flex;align-items:center;gap:12px;margin:6px 2px 14px}
.av{width:52px;height:52px;border-radius:50%;background:#e9f5ee;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex:0 0 auto;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.av img{width:100%;height:100%;object-fit:cover}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hb{border:0;border-radius:18px;padding:16px 14px;min-height:130px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-weight:700;font-size:17px;line-height:1.2;box-shadow:0 6px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s}
.hb:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.12)}
.hb .ic{font-size:34px;line-height:1}.hb small{display:block;font-weight:500;font-size:13px;opacity:.9;margin-top:4px}
.hb.p{background:linear-gradient(160deg,#4f8ad8,#2f63b0)}.hb.d{background:linear-gradient(160deg,#f0a43a,#d27a12)}
.hb.c{background:linear-gradient(160deg,#36b275,#1f7a4d);grid-column:1/3;min-height:110px}.hb.m{background:linear-gradient(160deg,#e0604f,#b83a2c)}
.pg{max-width:640px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.pghead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}.pghead h1{font-size:21px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}.emo button{padding:0;min-height:40px;font-size:22px;border-radius:10px}.emo button.on{background:var(--pri2);border-color:var(--pri)}
.bigav{width:110px;height:110px;font-size:62px;margin:8px auto}
.dogc{display:flex;gap:12px;align-items:center}.dogc .av{width:56px;height:56px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.pod{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.pod .ph{aspect-ratio:1;background:#eef2ec;display:flex;align-items:center;justify-content:center;font-size:44px}.pod .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pod .tx{padding:8px 10px;font-size:13px}.pod .tx b{display:block;font-size:14px}
.medal{display:inline-block;padding:2px 8px;border-radius:12px;background:#fff3c4;font-size:12px;font-weight:700;margin-bottom:3px}
.photoin{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:14px;min-height:170px;background:#fafbf9;overflow:hidden;cursor:pointer;margin-top:6px}
.photoin img{max-width:100%;max-height:320px;display:block}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
/* editor */
.editor{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line)}
.top #sharebtn{padding:9px 10px}
@media (max-width:420px){.top #sharebtn{font-size:0;padding:9px 12px}.top #sharebtn::before{content:'⤴︎';font-size:17px}}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:12px}.sheet .opt b{display:block}.sheet .opt span.muted{display:block}
.top .ttl{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.fw{position:relative;height:50vh;height:50dvh;flex:0 0 auto;background:#dfe8da;overflow:hidden}
.fw svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;padding:0;border-radius:50%;box-shadow:0 1px 4px #0002;font-size:18px}
.modebadge{position:absolute;left:8px;top:8px;background:#111c;color:#fff;font-size:12px;padding:4px 9px;border-radius:20px;pointer-events:none}
.side{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.sum{padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:14px}
.sum b{color:var(--pri)}
.sum .dogs{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;border-bottom:3px solid transparent;background:transparent;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.panel{flex:1;overflow:auto;padding:4px 12px calc(20px + env(safe-area-inset-bottom))}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pal button{padding:7px 10px;min-height:38px;font-size:14px;display:flex;align-items:center;gap:6px}
.pal svg{width:22px;height:22px}
input[type=range]{width:100%;accent-color:var(--pri)}
.steps{list-style:none;padding:0;margin:10px 0}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num.pa{background:#1f9d55}.num.ar{background:#d33}
.sh .tg{margin-left:auto;font-size:12px;color:var(--pri);font-weight:650;text-align:right}
.sb{padding:4px 10px 10px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:5px 10px;min-height:34px;font-size:13px;border-radius:20px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dogrow{display:grid;grid-template-columns:1fr 90px 40px;gap:6px;margin-bottom:6px}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.stat b{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:380px;width:100%}
.modal .box p{margin:0 0 14px}
.modal .row button{flex:1}
@media (min-width:900px) and (orientation:landscape){
 .editor{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr}
 .top{grid-column:1/3}
 .fw{height:auto}
 .side{border-left:1px solid var(--line)}
}
/* svg */
.field{fill:#86b96f}.gm{stroke:rgba(255,255,255,.22);stroke-width:.03}.gM{stroke:rgba(255,255,255,.5);stroke-width:.06}.border{fill:none;stroke:#fff;stroke-width:.12}
.ruler{font:.5px sans-serif;fill:#4b5a48;text-anchor:middle}
.bar{stroke:#e23b2e;stroke-width:.1;stroke-linecap:round}.wing{fill:#fff;stroke:#2b2b2b;stroke-width:.04}
.wall{fill:#c0603a;stroke:#5b2a17;stroke-width:.05}.wallj{stroke:#5b2a17;stroke-width:.03}
.frame{fill:#333}.tyre{fill:#f2c200;stroke:#333;stroke-width:.04}
.slat{fill:#fff;stroke:#333;stroke-width:.03}.pole{fill:#333}
.tun{fill:none;stroke:#1d4f91;stroke-width:.7;stroke-linejoin:round}.tun2{fill:none;stroke:#5a93dc;stroke-width:.5;stroke-dasharray:.07 .28;stroke-linejoin:round}
.slb{stroke:#555;stroke-width:.04}.pole2{fill:#fff;stroke:#c22;stroke-width:.05}
.plank{fill:#d9c9a3;stroke:#5c4a2a;stroke-width:.04}.pj{stroke:#5c4a2a;stroke-width:.04}.cz{fill:#e8463a;opacity:.85}.pivot{fill:#444}
.startc{fill:#1f9d55;stroke:#fff;stroke-width:.06}.finc{fill:#d33;stroke:#fff;stroke-width:.06}.flagt{fill:#fff;font:700 .55px sans-serif;text-anchor:middle}
.hit{fill:transparent}.ob.sel .hit{fill:rgba(255,255,255,.2);stroke:#ffeb3b;stroke-width:.08;stroke-dasharray:.25 .15}
.path{fill:none;stroke:var(--acc);stroke-width:.16;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.92}
.arr{fill:var(--acc);pointer-events:none}
.dist{font:600 .45px sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:.12;text-anchor:middle;pointer-events:none}
.badge{pointer-events:none}.badge circle{fill:#111;stroke:#fff;stroke-width:.06}.badge text{fill:#fff;font:700 .6px sans-serif;text-anchor:middle}
.badge .tg{fill:#111;font:700 .42px sans-serif;paint-order:stroke;stroke:#fff;stroke-width:.12}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ---------- costanti ---------- */
const TYPES={
 jump:{n:'Salto',w:1.6,l:.6},
 oxer:{n:'Salto doppio',w:1.6,l:.8},
 wall:{n:'Muro',w:1.4,l:.4},
 tyre:{n:'Ruota',w:1.4,l:.4},
 long:{n:'Salto in lungo',dir:1,w:1.4,l:1.4},
 tunnel:{n:'Tunnel',dir:1},
 slalom:{n:'Slalom',dir:1},
 dogwalk:{n:'Passerella',dir:1,len:11.4,w:.3},
 aframe:{n:'Palizzata',dir:1,len:4,w:.9},
 seesaw:{n:'Altalena',dir:1,len:3.8,w:.3},
 start:{n:'Partenza',w:1,l:1},
 finish:{n:'Arrivo',w:1,l:1}
};
const TAGS=[['In','IN'],['Out','OUT'],['Wrap','WR'],['Spin','SP'],['Backside','BS'],['Threadle','TH'],['Serpentina','SE'],['Front cross','FC'],['Rear cross','RC'],['Blind cross','BC'],['Ketschker','KE'],['Lato SX','SX'],['Lato DX','DX']];
const TAGAB=Object.fromEntries(TAGS);

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>Number(n).toLocaleString('it-IT',{maximumFractionDigits:d});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f2=n=>(Math.round(n*100)/100);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],mul=(a,k)=>[a[0]*k,a[1]*k];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const norm=v=>{const l=Math.hypot(v[0],v[1]);return l<1e-9?[0,-1]:[v[0]/l,v[1]/l]};
const last=a=>a[a.length-1];
function rotV(o,p){const a=(o.r||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c]}
function toW(o,p){const v=rotV(o,p);return[o.x+v[0],o.y+v[1]]}
function bez(a,b,c,d,t){const u=1-t;return[u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]]}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function ask(msg,btns){return new Promise(res=>{const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box"><p>${msg}</p><div class="row">${btns.map(b=>`<button data-k="${b[0]}" class="${b[2]||''}">${b[1]}</button>`).join('')}</div></div>`;d.onclick=e=>{const b=e.target.closest('[data-k]');if(b||e.target===d){d.remove();res(b?b.dataset.k:null)}};document.body.appendChild(d)})}

/* ---------- geometria ostacoli ---------- */
function tunnelPts(L,cv){
 if(Math.abs(cv)<1)return[[0,L/2],[0,-L/2]];
 const th=Math.abs(cv)*Math.PI/180,r=L/th,sg=cv>0?1:-1,N=24,p=[];
 for(let i=0;i<=N;i++){const a=th*i/N;p.push([sg*(r-r*Math.cos(a)),-r*Math.sin(a)])}
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;p.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});
 const cx=(x0+x1)/2,cy=(y0+y1)/2;return p.map(q=>[q[0]-cx,q[1]-cy]);
}
function localPts(o){
 switch(o.t){
  case'long':return[[0,.6],[0,-.6]];
  case'tunnel':return tunnelPts(o.len||4,o.curve||0);
  case'slalom':{const L=((o.poles||12)-1)*.6;return[[0,L/2],[0,-L/2]]}
  case'dogwalk':case'aframe':case'seesaw':{const L=TYPES[o.t].len;return[[0,L/2],[0,-L/2]]}
  default:return[[0,0]];
 }
}
function hitBox(o){
 const T=TYPES[o.t];let w,h;
 if(o.t==='tunnel'){const p=localPts(o);let a=[1e9,1e9,-1e9,-1e9];p.forEach(q=>{a[0]=Math.min(a[0],q[0]);a[1]=Math.min(a[1],q[1]);a[2]=Math.max(a[2],q[0]);a[3]=Math.max(a[3],q[1])});return[a[0]-.55,a[1]-.55,a[2]-a[0]+1.1,a[3]-a[1]+1.1]}
 if(o.t==='slalom'){w=1.2;h=((o.poles||12)-1)*.6+.8}
 else if(T.len){w=Math.max(T.w+.6,1.2);h=T.len+.4}
 else{w=Math.max(T.w,1.4)+.2;h=Math.max(T.l,1.2)}
 return[-w/2,-h/2,w,h];
}
function drawObs(o){
 const T=TYPES[o.t];
 switch(o.t){
  case'jump':return`<line x1="-.6" y1="0" x2=".6" y2="0" class="bar"/><rect x="-.78" y="-.3" width=".16" height=".6" class="wing"/><rect x=".62" y="-.3" width=".16" height=".6" class="wing"/>`;
  case'oxer':return`<line x1="-.6" y1="-.18" x2=".6" y2="-.18" class="bar"/><line x1="-.6" y1=".18" x2=".6" y2=".18" class="bar"/><rect x="-.78" y="-.4" width=".16" height=".8" class="wing"/><rect x=".62" y="-.4" width=".16" height=".8" class="wing"/>`;
  case'wall':return`<rect x="-.65" y="-.15" width="1.3" height=".3" class="wall"/><line x1="-.65" y1="0" x2=".65" y2="0" class="wallj"/>`;
  case'tyre':return`<rect x="-.7" y="-.06" width="1.4" height=".12" class="frame"/><rect x="-.36" y="-.15" width=".72" height=".3" rx=".15" class="tyre"/>`;
  case'long':{let s='';for(let i=0;i<4;i++)s+=`<rect x="-.6" y="${(-.62+i*.36).toFixed(2)}" width="1.2" height=".14" class="slat"/>`;[[-.68,-.68],[.68,-.68],[-.68,.68],[.68,.68]].forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r=".06" class="pole"/>`);return s}
  case'tunnel':{const p=localPts(o),d='M'+p.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');return`<path d="${d}" class="tun"/><path d="${d}" class="tun2"/>`}
  case'slalom':{const n=o.poles||12,L=(n-1)*.6;let s=`<line x1="0" y1="${L/2}" x2="0" y2="${-L/2}" class="slb"/>`;for(let i=0;i<n;i++)s+=`<circle cx="0" cy="${(L/2-i*.6).toFixed(2)}" r=".09" class="pole2"/>`;return s}
  case'dogwalk':{const L=T.len,h=L/2;return`<rect x="-.15" y="${-h}" width=".3" height="${L}" class="plank"/><line x1="-.15" y1="${(-h+L/3).toFixed(2)}" x2=".15" y2="${(-h+L/3).toFixed(2)}" class="pj"/><line x1="-.15" y1="${(-h+2*L/3).toFixed(2)}" x2=".15" y2="${(-h+2*L/3).toFixed(2)}" class="pj"/><rect x="-.15" y="${-h}" width=".3" height=".9" class="cz"/><rect x="-.15" y="${h-.9}" width=".3" height=".9" class="cz"/>`}
  case'aframe':{const L=T.len,h=L/2;return`<rect x="-.45" y="${-h}" width=".9" height="${L}" class="plank"/><line x1="-.45" y1="0" x2=".45" y2="0" class="pj"/><rect x="-.45" y="${-h}" width=".9" height="1" class="cz"/><rect x="-.45" y="${h-1}" width=".9" height="1" class="cz"/>`}
  case'seesaw':{const L=T.len,h=L/2;return`<rect x="-.38" y="-.1" width=".76" height=".2" class="pivot"/><rect x="-.15" y="${-h}" width=".3" height="${L}" class="plank"/><rect x="-.15" y="${-h}" width=".3" height=".9" class="cz"/><rect x="-.15" y="${h-.9}" width=".3" height=".9" class="cz"/>`}
  case'start':return`<circle r=".45" class="startc"/><g transform="rotate(${-(o.r||0)})"><text class="flagt" y=".19">P</text></g>`;
  case'finish':return`<circle r=".45" class="finc"/><g transform="rotate(${-(o.r||0)})"><text class="flagt" y=".19">A</text></g>`;
 }
 return'';
}
function icon(t){
 const o={t,x:0,y:0,r:t==='jump'||t==='oxer'||t==='wall'||t==='tyre'||t==='start'||t==='finish'||t==='long'?0:90,len:4,curve:t==='tunnel'?0:0,poles:6};
 const vb={jump:'-1 -1 2 2',oxer:'-1 -1 2 2',wall:'-1 -1 2 2',tyre:'-1 -1 2 2',long:'-1 -1 2 2',start:'-.6 -.6 1.2 1.2',finish:'-.6 -.6 1.2 1.2',tunnel:'-2.4 -2.4 4.8 4.8',slalom:'-1.8 -1.8 3.6 3.6',dogwalk:'-6 -6 12 12',aframe:'-2.4 -2.4 4.8 4.8',seesaw:'-2.1 -2.1 4.2 4.2'}[t];

/* ---------- calcolo percorso ---------- */
const isPA=t=>t==='start'||t==='finish';
function computePath(c){
 const map={};c.obs.forEach(o=>map[o.id]=o);
 const items=[];
 c.steps.forEach((s,i)=>{const o=map[s.o];if(!o)return;let lp=localPts(o);if(s.rev)lp=lp.slice().reverse();const wp=lp.map(p=>toW(o,p));items.push({s,i,o,wp,dir:!!TYPES[o.t].dir&&wp.length>1})});
 const tan=k=>{const pv=items[k-1],nx=items[k+1],p=items[k].wp[0];const a=pv?last(pv.wp):p,b=nx?nx.wp[0]:p;return norm(sub(b,a))};
 const pts=[],segs=[];let total=0;
 items.forEach((it,k)=>{
  if(k===0)pts.push(it.wp[0]);
  else{
   const A=items[k-1],a=last(A.wp),b=it.wp[0];
   const tA=A.dir?norm(sub(a,A.wp[A.wp.length-2])):tan(k-1);
   const tB=it.dir?norm(sub(it.wp[1],b)):tan(k);
   const d=dist(a,b),c1=add(a,mul(tA,d*.4)),c2=sub(b,mul(tB,d*.4));
   const N=24,seg=[];for(let j=0;j<=N;j++)seg.push(bez(a,c1,c2,b,j/N));
   let sl=0;for(let j=1;j<=N;j++)sl+=dist(seg[j-1],seg[j]);
   total+=sl;segs.push({len:sl,mid:seg[N/2],ang:Math.atan2(seg[N/2+1][1]-seg[N/2-1][1],seg[N/2+1][0]-seg[N/2-1][0])*180/Math.PI});
   for(let j=1;j<=N;j++)pts.push(seg[j]);
  }
  for(let j=1;j<it.wp.length;j++){total+=dist(it.wp[j-1],it.wp[j]);pts.push(it.wp[j])}
 });
 let n=0;items.forEach(it=>{it.num=isPA(it.o.t)?null:++n});
 return{pts,segs,total,items};
}
function stepNums(c){const map={};c.obs.forEach(o=>map[o.id]=o);let n=0;return c.steps.map(s=>{const o=map[s.o];if(!o||isPA(o.t))return null;return++n})}

/* ---------- rendering campo (svg) ---------- */
function fieldSVG(c,opt={}){
 const W=c.W,H=c.H;let g=`<rect x="0" y="0" width="${W}" height="${H}" class="field"/>`;
 for(let x=1;x<W;x++)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="${x%5?'gm':'gM'}"/>`;
 for(let y=1;y<H;y++)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="${y%5?'gm':'gM'}"/>`;
 g+=`<rect x="0" y="0" width="${W}" height="${H}" class="border"/>`;
 if(opt.full){for(let x=0;x<=W;x+=5)g+=`<text x="${x}" y="-.35" class="ruler">${x}</text>`;for(let y=5;y<=H;y+=5)g+=`<text x="-.6" y="${y+.17}" class="ruler">${y}</text>`}
 const P=computePath(c);
 c.obs.forEach(o=>{const hb=hitBox(o);g+=`<g data-id="${o.id}" class="ob${opt.sel===o.id?' sel':''}" transform="translate(${f2(o.x)} ${f2(o.y)}) rotate(${o.r||0})"><rect class="hit" x="${hb[0]}" y="${hb[1]}" width="${hb[2]}" height="${hb[3]}" rx=".2"/>${drawObs(o)}</g>`});
 if(P.pts.length>1){
  g+=`<polyline class="path" points="${P.pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')}"/>`;
  P.segs.forEach(s=>{g+=`<path class="arr" d="M.32 0 L-.2 -.22 L-.2 .22 Z" transform="translate(${s.mid[0].toFixed(2)} ${s.mid[1].toFixed(2)}) rotate(${s.ang.toFixed(1)}) scale(1.3)"/>`;if(opt.full&&opt.dist&&s.len>1.5)g+=`<text class="dist" x="${s.mid[0].toFixed(2)}" y="${(s.mid[1]-.45).toFixed(2)}">${fmt(s.len)} m</text>`});
 }
 if(opt.full||opt.badges){
  const cnt={};
  P.items.forEach(it=>{
   if(it.num==null)return;const o=it.o,k=cnt[o.id]=(cnt[o.id]||0);cnt[o.id]++;
   let p;if(it.dir){const pr=norm(rotV(o,[1,0]));p=add(it.wp[0],mul(pr,.95+k*1.25))}else p=[o.x+.95+k*1.25,o.y-.95];
   const tg=(it.s.tags||[]).map(t=>TAGAB[t]).filter(Boolean).join(' ');
   g+=`<g class="badge" transform="translate(${p[0].toFixed(2)} ${p[1].toFixed(2)})"><circle r=".55"/><text y=".21">${it.num}</text>${opt.full&&opt.tags&&tg?`<text class="tg" y="1.05">${esc(tg)}</text>`:''}</g>`;
  });
 }
 return{svg:g,P};
}

async function onEdClick(e){
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=S.cur,i=+b.dataset.i;
 switch(a){
  case'back':{if(S.dirty){const r=await ask('Ci sono modifiche non salvate.',[['cancel','Annulla'],['discard','Esci senza salvare','danger'],['save','Salva','primary']]);if(r==='save'){if(!await save())return}else if(r!=='discard')return}S.view='list';S.cur=null;svg=layer=null;renderList();return}
  case'save':{const ok=await save();if(ok)toast('Percorso salvato · tocca ⤴︎ Condividi per PDF e stampa');return}
  case'sharemenu':{if(S.dirty){if(!await save())return}shareSheet(c);return}
  case'zin':zoomAt(1/1.35);return;case'zout':zoomAt(1.35);return;case'fit':fitView();return;
  case'tab':S.tab=b.dataset.t;S.open=null;renderPanel();renderField();$('#panel').scrollTop=0;return;
  case'add':{const t=b.dataset.t;const v=S.vb;const o={id:uid(),t,x:snapV(clamp(v.x+v.w/2,1,c.W-1)),y:snapV(clamp(v.y+v.h/2,1,c.H-1)),r:0};if(t==='tunnel'){o.len=4;o.curve=0}if(t==='slalom')o.poles=12;c.obs.push(o);S.sel=o.id;markDirty();renderField();renderPanel();return}
  case'rot':{const o=obsById(S.sel);if(!o)return;o.r=((o.r||0)+ +b.dataset.d+360)%360;markDirty();renderField();renderPanel();return}
  case'dup':{const o=obsById(S.sel);if(!o)return;const n=Object.assign({},o,{id:uid(),x:clamp(o.x+1.5,0,c.W),y:clamp(o.y+1.5,0,c.H)});c.obs.push(n);S.sel=n.id;markDirty();renderField();renderPanel();return}
  case'del':{const o=obsById(S.sel);if(!o)return;const used=c.steps.some(s=>s.o===o.id);if(used){const r=await ask('Questo ostacolo è nella numerazione: verrà tolto anche da lì.',[['no','Annulla'],['yes','Elimina','danger']]);if(r!=='yes')return}c.obs=c.obs.filter(x=>x.id!==o.id);c.steps=c.steps.filter(s=>s.o!==o.id);S.sel=null;markDirty();renderField();renderPanel();return}
  case'desel':S.sel=null;renderField();renderPanel();return;
  case'undo':c.steps.pop();S.open=null;markDirty();renderField();renderPanel();return;
  case'clrseq':{const r=await ask('Cancellare tutta la numerazione? Gli ostacoli restano sul campo.',[['no','Annulla'],['yes','Cancella','danger']]);if(r==='yes'){c.steps=[];S.open=null;markDirty();renderField();renderPanel()}return}
  case'openstep':S.open=S.open===i?null:i;renderPanel();return;
  case'tag':{const s=c.steps[i],t=b.dataset.tag;s.tags=s.tags||[];const k=s.tags.indexOf(t);if(k>=0)s.tags.splice(k,1);else{
    if(t==='Lato SX')s.tags=s.tags.filter(x=>x!=='Lato DX');if(t==='Lato DX')s.tags=s.tags.filter(x=>x!=='Lato SX');
    if(t==='In')s.tags=s.tags.filter(x=>x!=='Out');if(t==='Out')s.tags=s.tags.filter(x=>x!=='In');s.tags.push(t)}
   markDirty();renderField();renderPanel();return}
  case'rev':c.steps[i].rev=!c.steps[i].rev;markDirty();renderField();renderPanel();return;
  case'up':if(i>0){[c.steps[i-1],c.steps[i]]=[c.steps[i],c.steps[i-1]];S.open=i-1;markDirty();renderField();renderPanel()}return;
  case'down':if(i<c.steps.length-1){[c.steps[i+1],c.steps[i]]=[c.steps[i],c.steps[i+1]];S.open=i+1;markDirty();renderField();renderPanel()}return;
  case'rmstep':c.steps.splice(i,1);S.open=null;markDirty();renderField();renderPanel();return;
  case'rotfield':{const H=c.H;c.obs.forEach(o=>{const x=o.x;o.x=f2(H-o.y);o.y=f2(x);o.r=((o.r||0)+90)%360});[c.W,c.H]=[c.H,c.W];markDirty();fitView();renderField();renderPanel();return}
  case'adddog':S.dogs=(S.dogs||[]).concat([{id:uid(),name:'',speed:4,emoji:'🐕'}]);await saveDogs();renderPanel();updSum();return;
  case'rmdog':S.dogs.splice(i,1);await saveDogs();renderPanel();updSum();return;
  case'sharejson':{const body=JSON.parse(JSON.stringify(c));delete body.id;shareFile(slug(c.name)+'.json',body);return}
  case'sharepng':sharePNG(c);return;
  case'sharepdf':sharePDF(c,true);return;
  case'copyjson':{const body=JSON.parse(JSON.stringify(c));delete body.id;const txt=JSON.stringify(body);try{await navigator.clipboard.writeText(txt);toast('Copiato negli appunti')}catch(err){const t=$('#jsonout');t.style.display='';t.value=txt;t.focus();t.select();toast('Seleziona e copia il testo')}return}
 }
}

function svgPt(cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const m=svg.getScreenCTM();if(!m)return[0,0];const r=pt.matrixTransform(m.inverse());return[r.x,r.y]}
function upp(){const r=svg.getBoundingClientRect();return Math.max(S.vb.w/r.width,S.vb.h/r.height)}
function zoomAt(f,px,py){const c=S.cur,v=S.vb;if(px==null){px=v.x+v.w/2;py=v.y+v.h/2}const nw=clamp(v.w*f,4,(Math.max(c.W,c.H)+3)*1.6),k=nw/v.w;v.x=px-(px-v.x)*k;v.y=py-(py-v.y)*k;v.w=nw;v.h*=k;applyVB()}
function bindField(){
 const ptrs=new Map();let drag=null,pinch=null;
 svg.addEventListener('pointerdown',e=>{
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const a=[...ptrs.values()];pinch={d0:dist(a[0],a[1]),vb0:Object.assign({},S.vb),c0:svgPt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2)};if(drag&&drag.kind==='obj'&&drag.moved){markDirty()}drag=null;return}
  if(ptrs.size>2)return;
  const g=e.target.closest&&e.target.closest('[data-id]');const p=svgPt(e.clientX,e.clientY);
  if(g){const o=obsById(g.dataset.id);if(!o)return;
   if(S.tab==='seq')drag={kind:'tap',id:o.id,sx:e.clientX,sy:e.clientY};
   else if(S.tab==='obs'){const was=S.sel;S.sel=o.id;drag={kind:'obj',id:o.id,dx:p[0]-o.x,dy:p[1]-o.y,sx:e.clientX,sy:e.clientY,moved:false};renderField();if(was!==o.id)renderPanel()}
   else drag={kind:'pan',sx:e.clientX,sy:e.clientY,v:Object.assign({},S.vb),u:upp(),moved:false};
  }else drag={kind:'pan',sx:e.clientX,sy:e.clientY,v:Object.assign({},S.vb),u:upp(),moved:false};
 });
 svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const a=[...ptrs.values()],d=dist(a[0],a[1]);if(d<10)return;const c=S.cur,v0=pinch.vb0;const nw=clamp(v0.w*pinch.d0/d,4,(Math.max(c.W,c.H)+3)*1.6),k=nw/v0.w;S.vb={x:pinch.c0[0]-(pinch.c0[0]-v0.x)*k,y:pinch.c0[1]-(pinch.c0[1]-v0.y)*k,w:nw,h:v0.h*k};applyVB();return}
  if(!drag)return;const mv=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);
  if(drag.kind==='obj'){if(!drag.moved&&mv<4)return;drag.moved=true;const o=obsById(drag.id);if(!o)return;const p=svgPt(e.clientX,e.clientY);o.x=snapV(clamp(p[0]-drag.dx,0,S.cur.W));o.y=snapV(clamp(p[1]-drag.dy,0,S.cur.H));const co=$('#coords');if(co)co.textContent=`x ${fmt(o.x)} · y ${fmt(o.y)} m`;renderField()}
  else if(drag.kind==='pan'){if(!drag.moved&&mv<5)return;drag.moved=true;S.vb.x=drag.v.x-(e.clientX-drag.sx)*drag.u;S.vb.y=drag.v.y-(e.clientY-drag.sy)*drag.u;applyVB()}
  else if(drag.kind==='tap'&&mv>8){drag={kind:'pan',sx:drag.sx,sy:drag.sy,v:Object.assign({},S.vb),u:upp(),moved:true}}
 });
 const end=e=>{
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!drag)return;
  if(drag.kind==='obj'&&drag.moved)markDirty();

  else if(drag.kind==='pan'&&!drag.moved&&S.tab==='obs'&&S.sel){S.sel=null;renderField();renderPanel()}
  drag=null;
 };
 svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null;drag=null});
 svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e.clientX,e.clientY);zoomAt(e.deltaY>0?1.12:1/1.12,p[0],p[1])},{passive:false});
}

const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('agility',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 async get(k){const d=await this.open();return new Promise(res=>{const t=d.transaction('img').objectStore('img').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)})},
 async del(k){const d=await this.open();return new Promise(res=>{const t=d.transaction('img','readwrite');t.objectStore('img').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})},
 async keys(){const d=await this.open();return new Promise(res=>{const t=d.transaction('img').objectStore('img').getAllKeys();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([])})}};
const IMGURL={};
async function imgURL(k){if(!k)return null;if(IMGURL[k])return IMGURL[k];try{const b=await IDB.get(k);if(!b)return null;return IMGURL[k]=URL.createObjectURL(b)}catch(e){return null}}
function dropURL(k){if(IMGURL[k]){URL.revokeObjectURL(IMGURL[k]);delete IMGURL[k]}}

function shrink(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.85)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}

const BARI={lat:41.1171,lon:16.8719};
function wKind(c){c=+c;if(c===0)return'clear';if(c<=2)return'partly';if(c===3)return'cloudy';if(c===45||c===48)return'fog';if(c>=51&&c<=57)return'drizzle';if((c>=61&&c<=67)||(c>=80&&c<=82))return'rain';if((c>=71&&c<=77)||c===85||c===86)return'snow';if(c>=95)return'storm';return'cloudy'}
const WLBL={clear:['☀️','Sereno','🌙','Sereno'],partly:['🌤','Poco nuvoloso','☁️','Poco nuvoloso'],cloudy:['☁️','Nuvoloso','☁️','Nuvoloso'],fog:['🌫','Nebbia','🌫','Nebbia'],drizzle:['🌦','Pioviggine','🌧','Pioviggine'],rain:['🌧','Pioggia','🌧','Pioggia'],snow:['🌨','Neve','🌨','Neve'],storm:['⛈','Temporale','⛈','Temporale']};

async function loadWeather(force){
 if(!force&&WX&&Date.now()-WX.t<15*60e3)return WX;
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${BARI.lat}&longitude=${BARI.lon}&current=temperature_2m,weather_code,is_day,wind_speed_10m,cloud_cover&timezone=Europe%2FRome`,{cache:'no-store'});
  if(!r.ok)throw 0;const d=await r.json(),c=d.current;WX={t:Date.now(),day:!!c.is_day,kind:wKind(c.weather_code),code:c.weather_code,temp:Math.round(c.temperature_2m),wind:Math.round(c.wind_speed_10m)};lsSet('ag_wx',WX);return WX}
 catch(e){return WX&&Date.now()-WX.t<6*3600e3?WX:null}
}
let HID=0;
function heroSVG(w){
 w=w||localWeather();const sid='sky'+(++HID);const k=w.kind,day=w.day;let rnd=7;const R=()=>(rnd=(rnd*9301+49297)%233280)/233280;
 const sky=day?({clear:['#7fc6f2','#e3f4ff'],partly:['#93c9ea','#e6f3fa'],cloudy:['#a9b9c4','#e4eaed'],fog:['#c8d1d6','#eef1f2'],drizzle:['#95a6b1','#d5dde1'],rain:['#7d8e99','#c4ced3'],snow:['#b8c6d0','#eef2f5'],storm:['#5d6b78','#a7b2ba']}[k]):({clear:['#0d1838','#2d4170'],partly:['#121d3a','#334468'],cloudy:['#1b2231','#3a4352'],fog:['#262c36','#4a525c'],drizzle:['#161d29','#323b48'],rain:['#121822','#2c3440'],snow:['#1c2431','#46505e'],storm:['#0c1018','#262c36']}[k]);
 let g=`<defs><linearGradient id="${sid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>__DEFS__</defs><rect width="360" height="230" fill="url(#${sid})"/>`;
 const clearish=k==='clear'||k==='partly';
 if(!day){let st='';for(let i=0;i<(clearish?26:6);i++)st+=`<circle class="tw" cx="${(R()*360).toFixed(0)}" cy="${(R()*110).toFixed(0)}" r="${(0.6+R()*1.2).toFixed(1)}" style="animation-delay:${(R()*3).toFixed(2)}s"/>`;g+=`<g fill="#fff">${st}</g>`;
  if(k!=='storm'&&k!=='rain')g+=`<g><circle cx="300" cy="46" r="20" fill="#fff6c9"/><circle cx="309" cy="40" r="17" fill="${sky[0]}"/></g>`}
 else if(k==='clear'||k==='partly'){g+=`<g class="sun" transform="translate(300 46)">${Array.from({length:10},(_,i)=>`<rect x="-2" y="-36" width="4" height="10" rx="2" fill="#ffd34d" transform="rotate(${i*36})"/>`).join('')}<circle r="20" fill="#ffd34d"/><circle r="15" fill="#ffe27a"/></g>`}
 const nC={clear:0,partly:2,cloudy:4,fog:2,drizzle:3,rain:4,snow:3,storm:5}[k];
 const cc=day?(k==='storm'||k==='rain'?'#8b98a1':'#ffffff'):(k==='storm'||k==='rain'?'#3a4250':'#5b6575');
 const cloud=(x,y,s,o,d)=>`<g class="cl" style="animation-duration:${d}s"><g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><circle cx="0" cy="10" r="16"/><circle cx="20" cy="0" r="20"/><circle cx="44" cy="8" r="17"/><rect x="-14" y="8" width="72" height="18" rx="9"/></g></g>`;
 if(nC){let c='';const pos=[[30,28,1],[150,18,1.2],[235,52,0.9],[90,62,0.8],[290,22,1.1]];for(let i=0;i<nC;i++){const p=pos[i];c+=cloud(p[0],p[1],p[2],k==='partly'?.9:.95,40+i*9)}g+=`<g fill="${cc}">${c}</g>`}
 if(k==='storm')g+=`<rect class="flash" width="360" height="230" fill="#fff"/><path class="bolt" d="M200 60 L188 98 L200 98 L186 140 L214 90 L201 90 L212 60 Z" fill="#ffe066"/>`;
 g+=HERO_FG;
 if(k==='rain'||k==='storm'||k==='drizzle')g+=`<g fill="${day?'#7aa9c8':'#4b6a85'}" opacity=".55"><ellipse cx="240" cy="200" rx="22" ry="3"/><ellipse cx="100" cy="206" rx="16" ry="2.5"/></g>`;
 if(k==='snow')g+=`<path d="M10 204 Q180 186 350 204 L350 220 L10 220 Z" fill="#fff" opacity=".85"/><path d="M62 123 L135 63 L208 123" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
 if(!day)g+=`<rect width="360" height="230" fill="#0b1430" opacity=".32"/><circle cx="135" cy="111" r="16" fill="#ffe9a8" opacity=".25"/>`;
 g+=HERO_Z;
 if(k==='rain'||k==='storm'||k==='drizzle'){const n=k==='drizzle'?26:60;let r='';for(let i=0;i<n;i++){const x=(R()*380-10).toFixed(0),d=(0.55+R()*0.4)*(k==='drizzle'?1.6:1);r+=`<line class="rd" x1="${x}" y1="-20" x2="${x-4}" y2="${k==='drizzle'?-12:-6}" style="animation-duration:${d.toFixed(2)}s;animation-delay:${(-R()*2).toFixed(2)}s"/>`}g+=`<g stroke="${day?'#5f86a3':'#9bb4cc'}" stroke-width="${k==='drizzle'?1:1.6}" stroke-linecap="round" opacity=".8">${r}</g>`}
 if(k==='snow'){let r='';for(let i=0;i<45;i++)r+=`<circle class="sf" cx="${(R()*360).toFixed(0)}" cy="-6" r="${(1.2+R()*2).toFixed(1)}" style="animation-duration:${(4+R()*4).toFixed(1)}s;animation-delay:${(-R()*8).toFixed(1)}s"/>`;g+=`<g fill="#fff">${r}</g>`}
 if(k==='fog')g+=`<g fill="#fff"><rect class="fg" x="-60" y="120" width="480" height="26" rx="13" opacity=".34"/><rect class="fg" x="-80" y="160" width="520" height="30" rx="15" opacity=".4" style="animation-duration:14s"/><rect class="fg" x="-40" y="80" width="460" height="22" rx="11" opacity=".35" style="animation-duration:18s"/></g>`;
 const L=WLBL[k],lbl=w.offline?'':`<g transform="translate(10 10)"><rect width="${Math.round(30+(' Bari'+(w.temp!=null?' · '+w.temp+'°':'')+' · '+(day?L[1]:L[3])).length*6.6)}" height="26" rx="13" fill="${day?'#ffffff':'#0d1838'}" opacity=".78"/><text x="12" y="17.5" font-family="-apple-system,Helvetica,Arial" font-size="12" font-weight="700" fill="${day?'#1d2420':'#fff'}">${day?L[0]:L[2]} Bari${w.temp!=null?' · '+w.temp+'°':''} · ${day?L[1]:L[3]}</text></g>`;
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" class="wx-${k} ${day?'day':'night'}">${g.replace('__DEFS__','<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98a4b"/><stop offset="1" stop-color="#a86b34"/></linearGradient>')}${lbl}</svg>`;
}

 draw();document.body.appendChild(m);
}
function podDialog(x){
 const isNew=!x;x=x?Object.assign({},x):{id:uid(),date:new Date().toISOString().slice(0,10),place:'',event:'',result:'',dog:S.dogs.length===1?S.dogs[0].name:'',note:''};
 let newImg=null;
 const m=document.createElement('div');m.className='modal';
 const RES=['🥇 1° posto','🥈 2° posto','🥉 3° posto','🏅 Medaglia','✨ Netto','⭐ Qualifica','🏆 Altro'];
 const draw=()=>{m.innerHTML=`<div class="box" style="max-height:92vh;overflow:auto"><p><b>${isNew?'Nuovo podio':'Il tuo podio'}</b></p>
  <div class="photoin" data-k="photo">${newImg?`<img src="${newImg.url}" alt="">`:x.img?`<img data-k="${x.img}" data-fb="🏆" alt="">`:`<span class="muted" style="text-align:center">📷<br>Tocca per caricare la foto</span>`}</div>
  <label>Risultato</label><div class="chips">${RES.map(r=>`<button data-k="res" data-r="${r}" class="${x.result===r?'on':''}">${r}</button>`).join('')}</div>
  <label>Gara / evento</label><input type="text" id="pe" value="${esc(x.event)}" placeholder="es. Campionato regionale – Agility 2">
  <div class="row"><div class="grow"><label>Data</label><input type="date" id="pd" value="${esc(x.date)}" style="min-height:40px"></div><div class="grow"><label>Luogo</label><input type="text" id="pl" value="${esc(x.place)}" placeholder="es. Bari"></div></div>
  <label>Cane</label>${S.dogs.length?`<select id="pg"><option value="">—</option>${S.dogs.map(d=>`<option ${d.name===x.dog?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:`<input type="text" id="pg" value="${esc(x.dog)}" placeholder="Nome del cane">`}
  <label>Note</label><textarea id="pn" rows="2" placeholder="es. netto e 2° tempo di categoria">${esc(x.note||'')}</textarea>
  <div class="row" style="margin-top:14px">${isNew?'':`<button class="danger" data-k="del">Elimina</button>`}${!isNew&&x.img?`<button data-k="share">⤴︎</button>`:''}<button data-k="x">Annulla</button><button class="primary grow" data-k="ok">Salva</button></div></div>`;fillImgs(m)};
 const read=()=>{const v=id=>m.querySelector('#'+id).value;x.event=v('pe').trim();x.date=v('pd');x.place=v('pl').trim();x.dog=v('pg');x.note=v('pn').trim()};
 m.onclick=async e=>{const b=e.target.closest('[data-k]');if(!b){if(e.target===m){if(newImg)URL.revokeObjectURL(newImg.url);m.remove()}return}const k=b.dataset.k;
  if(k==='x'){if(newImg)URL.revokeObjectURL(newImg.url);m.remove();return}
  read();
  if(k==='res'){x.result=x.result===b.dataset.r?'':b.dataset.r;draw();return}
  if(k==='photo'){const bl=await pickPhoto(1600);if(bl){if(newImg)URL.revokeObjectURL(newImg.url);newImg={blob:bl,url:URL.createObjectURL(bl)};draw()}return}
  if(k==='share'){const bl=await IDB.get(x.img);if(bl)shareBlob(slug(x.event||'podio')+'.jpg',bl);return}
  if(k==='del'){const r=await ask('Eliminare questo podio e la sua foto?',[['no','Annulla'],['yes','Elimina','danger']]);if(r!=='yes')return;if(x.img){IDB.del(x.img).catch(()=>{});dropURL(x.img)}S.podi=S.podi.filter(y=>y.id!==x.id);savePodi();m.remove();render();return}
  if(k==='ok'){
   if(!x.event&&!newImg&&!x.img){toast('Aggiungi almeno la foto o il nome della gara');return}
   if(newImg){const key='pod-'+x.id+'-'+Date.now();try{await IDB.put(key,newImg.blob);if(x.img){IDB.del(x.img).catch(()=>{});dropURL(x.img)}x.img=key}catch(e){toast('Spazio non disponibile per la foto');return}URL.revokeObjectURL(newImg.url)}
   const i=S.podi.findIndex(y=>y.id===x.id);if(i>=0)S.podi[i]=x;else S.podi.push(x);savePodi();m.remove();render();toast(isNew?'Podio salvato 🏆':'Salvato')}};
 draw();document.body.appendChild(m);
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-h]');if(!b)return;const h=b.dataset.h;
 if(h==='wxref'){refreshHero(true);return}
 if(['home','list','profile','dogs','podi'].includes(h)){if(h==='list')S.libTab=S.libTab||'mine';go(h);return}
 if(h==='pemo'){S.profile=Object.assign({},S.profile||{},{emoji:b.dataset.e});if(S.profile.photo){IDB.del(S.profile.photo).catch(()=>{});dropURL(S.profile.photo);delete S.profile.photo}keepProfileInputs();saveProfile();render();restoreProfileInputs();return}
 if(h==='pphoto'){const bl=await pickPhoto(800);if(!bl)return;const key='prof-'+Date.now();try{await IDB.put(key,bl)}catch(err){toast('Spazio non disponibile per la foto');return}keepProfileInputs();if(S.profile&&S.profile.photo){IDB.del(S.profile.photo).catch(()=>{});dropURL(S.profile.photo)}S.profile=Object.assign({},S.profile||{},{photo:key});saveProfile();render();restoreProfileInputs();return}
 if(h==='pphotodel'){keepProfileInputs();if(S.profile&&S.profile.photo){IDB.del(S.profile.photo).catch(()=>{});dropURL(S.profile.photo);delete S.profile.photo}saveProfile();render();restoreProfileInputs();return}
 if(h==='psave'){const n=$('#pname').value.trim(),a=$('#page').value;S.profile=Object.assign({},S.profile||{},{name:n,age:a===''?'':num(a)});if(!S.profile.emoji&&!S.profile.photo)S.profile.emoji='🙂';saveProfile();toast('Profilo salvato');go('home');return}
 if(h==='dognew'){dogDialog(null);return}
 if(h==='dogedit'){const d=S.dogs.find(x=>x.id===b.dataset.id);if(d)dogDialog(d);return}
 if(h==='podnew'){podDialog(null);return}
 if(h==='podedit'){const x=S.podi.find(y=>y.id===b.dataset.id);if(x)podDialog(x);return}
});
let _pin=null;function keepProfileInputs(){const n=$('#pname'),a=$('#page');_pin=n?{n:n.value,a:a.value}:null}
function restoreProfileInputs(){if(_pin&&$('#pname')){$('#pname').value=_pin.n;$('#page').value=_pin.a}}

/* ---------- PWA: file, condivisione, backup ---------- */
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function slug(n){return (n||'percorso').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'percorso'}
async function shareBlob(name,blob){
 try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function shareFile(name,obj){shareBlob(name,new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}))}
const blob2data=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)});
async function fullBackup(){
 toast('Preparo il backup…');const imgs={};
 try{for(const k of await IDB.keys()){const b=await IDB.get(k);if(b){const d=await blob2data(b);if(d)imgs[k]=d}}}catch(e){}
 const d=new Date().toISOString().slice(0,10);
 shareFile('agility-backup-'+d+'.json',{app:'percorsi-agility',v:2,courses:S.courses,dogs:S.dogs,profile:S.profile,podi:S.podi,imgs});
}
document.addEventListener('click',e=>{if(S.view!=='home')return;const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='backup')fullBackup();else if(b.dataset.act==='restore')restoreBackup()});
function restoreBackup(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.courses))throw 0;
  const r=await ask(`Il backup contiene ${d.courses.length} percorsi${d.podi?`, ${d.podi.length} podi`:''}${d.dogs?` e ${d.dogs.length} cani`:''}. Unirli a quelli presenti o sostituire tutto?`,[['no','Annulla'],['merge','Unisci'],['replace','Sostituisci','danger']]);
  if(!r||r==='no')return;let a=r==='replace'?[]:lsGet('ag_courses',[]);const ids=new Set(d.courses.map(c=>c.id));a=a.filter(c=>!ids.has(c.id)).concat(d.courses);
  lsSet('ag_courses',a);if(Array.isArray(d.dogs)&&(r==='replace'||!S.dogs.length)){S.dogs=d.dogs.map(x=>Object.assign({id:x.id||uid()},x));lsSet('ag_dogs',S.dogs)}
  if(d.profile&&(r==='replace'||!S.profile)){S.profile=d.profile;saveProfile()}
  if(Array.isArray(d.podi)){const ids=new Set(d.podi.map(x=>x.id));S.podi=(r==='replace'?[]:S.podi.filter(x=>!ids.has(x.id))).concat(d.podi);savePodi()}
  if(d.imgs){for(const k in d.imgs){try{const bl=await (await fetch(d.imgs[k])).blob();await IDB.put(k,bl);dropURL(k)}catch(e){}}}
  S.courses=a.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));render();toast('Backup ripristinato')}catch(e){toast('File di backup non valido')}};
 i.click();
}
function courseCanvas(c,maxPx,print){
 return new Promise((res,rej)=>{
  const r=fieldSVG(c,{full:true,dist:S.dist,tags:S.tags});const css=[...document.styleSheets[0].cssRules].map(x=>x.cssText).filter(t=>/^\.(field|g[mM]|border|ruler|bar|wing|wall|frame|tyre|slat|pole|tun|slb|plank|pj|cz|pivot|startc|finc|flagt|path|arr|dist|badge)/.test(t)).join('').replace(/var\(--acc\)/g,'#ff7a00')+(print?'.field{fill:#f6f9f4}.gm{stroke:rgba(0,0,0,.07)}.gM{stroke:rgba(0,0,0,.2)}.border{stroke:#8a958c}':'');
  const pad=1.6,W=c.W+pad*2,H=c.H+pad*2,sc=Math.min(80,(maxPx||4000)/Math.max(W,H));
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W*sc)}" height="${Math.round(H*sc)}" viewBox="${-pad} ${-pad} ${W} ${H}"><style>${css}</style><rect x="${-pad}" y="${-pad}" width="${W}" height="${H}" fill="#fff"/>${r.svg.replace(/ data-id="[^"]*"/g,'').replace(/<rect class="hit"[^>]*\/>/g,'')}</svg>`;
  const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0);res({cv,P:r.P})};
  img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
 });
}
function courseInfo(c,P){const L=c.refLen>0?c.refLen:P.total,tps=Math.ceil(L/(c.judgeSpeed||3.5)),tpm=Math.ceil(tps*(c.coeff||1.5));return{L,tps,tpm,ok:P.items.length>1}}
async function sharePNG(c){
 try{const {cv,P}=await courseCanvas(c,3600);const I=courseInfo(c,P);
  const top=Math.round(cv.width*0.05),out=document.createElement('canvas');out.width=cv.width;out.height=cv.height+top;const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,out.width,out.height);g.drawImage(cv,0,top);
  g.fillStyle='#1d2420';g.font=`700 ${Math.round(top*.42)}px -apple-system,Helvetica,Arial`;g.fillText(c.name||'Percorso',top*.4,top*.55);
  g.font=`${Math.round(top*.28)}px -apple-system,Helvetica,Arial`;g.fillStyle='#555';g.fillText([[c.kind,c.grade&&('Grado '+c.grade),c.size].filter(Boolean).join(' '),c.judge,I.ok?`${fmt(I.L)} m · TPS ${I.tps} s · TPM ${I.tpm} s`:''].filter(Boolean).join('   —   '),top*.4,top*.92);
  out.toBlob(b=>{if(b)shareBlob(slug(c.name)+'.png',b);else toast('Impossibile creare l\'immagine')},'image/png');
 }catch(e){toast('Impossibile creare l\'immagine')}
}
let jspdfP=null;
function loadJsPDF(){if(window.jspdf)return Promise.resolve(window.jspdf);if(!jspdfP)jspdfP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='jspdf.umd.min.js';sc.onload=()=>window.jspdf?res(window.jspdf):rej(new Error('jspdf'));sc.onerror=()=>{jspdfP=null;rej(new Error('jspdf'))};document.head.appendChild(sc)});return jspdfP}
const pdfTxt=t=>String(t==null?'':t).replace(/[–—]/g,'-').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,'');
async function sharePDF(c,withList){
 toast('Preparo il PDF…');
 try{
  const [{jsPDF},{cv,P}]=await Promise.all([loadJsPDF(),courseCanvas(c,3200,true)]);
  const I=courseInfo(c,P),land=c.W>=c.H;
  const doc=new jsPDF({orientation:land?'landscape':'portrait',unit:'mm',format:'a4'});
  const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),M=10;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(pdfTxt(c.name||'Percorso'),M,M+5);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  const sub=[[c.kind,c.grade&&('Grado '+c.grade),c.size&&('Cat. '+c.size)].filter(Boolean).join(' · '),c.judge&&('Giudice: '+c.judge),`Campo ${fmt(c.W)}×${fmt(c.H)} m`].filter(Boolean).join('   |   ');
  doc.text(pdfTxt(sub),M,M+11);
  if(I.ok){doc.setTextColor(31,122,77);doc.setFont('helvetica','bold');doc.text(pdfTxt(`Lunghezza ${fmt(I.L)} m${c.refLen>0?' (ufficiale)':''}   ·   TPS ${I.tps} s   ·   TPM ${I.tpm} s`+((S.dogs||[]).filter(d=>d.speed>0).length?'   ·   '+S.dogs.filter(d=>d.speed>0).map(d=>`${d.name||'Cane'} ${fmt(I.L/d.speed)} s`).join(', '):'')),M,M+17)}
  doc.setTextColor(0);doc.setFont('helvetica','normal');
  const top=M+21,aw=PW-2*M,ah=PH-top-M-6,ar=cv.width/cv.height;let w=aw,h=w/ar;if(h>ah){h=ah;w=h*ar}
  doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',M+(aw-w)/2,top,w,h);
  doc.setFontSize(8);doc.setTextColor(140);doc.text(pdfTxt('Percorsi Agility · '+new Date().toLocaleDateString('it-IT')+(c.notes?'  ·  '+c.notes:'')).slice(0,180),M,PH-M+2);doc.setTextColor(0);
  if(withList&&c.steps.length){
   doc.addPage('a4','portrait');const W2=doc.internal.pageSize.getWidth(),H2=doc.internal.pageSize.getHeight();
   doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(pdfTxt('Sequenza – '+(c.name||'')),M,M+5);
   const map={};c.obs.forEach(o=>map[o.id]=o);const nums=stepNums(c);let y=M+14;doc.setFontSize(10);
   c.steps.forEach((st,i)=>{const o=map[st.o];if(!o)return;const n=nums[i];
    const lbl=(n!=null?n+'.':(o.t==='start'?'P':'A'))+'  '+TYPES[o.t].n+(st.rev?' (verso inverso)':'');
    const extra=[(st.tags||[]).join(', '),st.note].filter(Boolean).join(' – ');
    if(y>H2-M){doc.addPage('a4','portrait');y=M+6}
    doc.setFont('helvetica','bold');doc.text(pdfTxt(lbl),M,y);
    if(extra){doc.setFont('helvetica','normal');const ln=doc.splitTextToSize(pdfTxt(extra),W2-2*M-60);doc.text(ln,M+60,y);y+=5*Math.max(1,ln.length)}else y+=5.5;
    doc.setDrawColor(225);doc.line(M,y-3.6,W2-M,y-3.6);
   });
  }
  await shareBlob(slug(c.name)+'.pdf',doc.output('blob'));
 }catch(e){toast(e&&e.message==='jspdf'?'Serve la rete la prima volta per creare il PDF':'Impossibile creare il PDF')}
}
function shareSheet(c){
 const d=document.createElement('div');d.className='modal';
 d.innerHTML=`<div class="box sheet"><p><b>Condividi o stampa</b><br><span class="muted">${esc(c.name)}</span></p>
 <button class="opt" data-k="pdf"><span style="font-size:24px">📄</span><span><b>PDF da stampare</b><span class="muted">Mappa del percorso con lunghezza, TPS e TPM. Dal menu Condividi scegli “Stampa”, WhatsApp, Mail o File.</span></span></button>
 <button class="opt" data-k="pdfl"><span style="font-size:24px">📋</span><span><b>PDF con sequenza</b><span class="muted">Come sopra più una pagina con i numeri, le sigle di conduzione e le note.</span></span></button>
 <button class="opt" data-k="png"><span style="font-size:24px">🖼</span><span><b>Immagine</b><span class="muted">PNG da mandare nel gruppo o salvare in Foto.</span></span></button>
 <button class="opt" data-k="json"><span style="font-size:24px">📁</span><span><b>File percorso</b><span class="muted">Chi lo riceve lo apre con “Importa” e può modificarlo.</span></span></button>
 <div class="row"><button data-k="x" style="flex:1">Chiudi</button></div></div>`;
 d.onclick=e=>{const b=e.target.closest('[data-k]');if(!b&&e.target!==d)return;d.remove();const k=b&&b.dataset.k;
  if(k==='pdf')sharePDF(c,false);else if(k==='pdfl')sharePDF(c,true);else if(k==='png')sharePNG(c);
  else if(k==='json'){const body=JSON.parse(JSON.stringify(c));delete body.id;shareFile(slug(c.name)+'.json',body)}};
 document.body.appendChild(d);
}

render();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
